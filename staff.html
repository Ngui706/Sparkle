<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sparkle Laundry | Staff portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-1: #0f172a;
      --bg-2: #1d4ed8;
      --bg-3: #7c3aed;
      --panel: rgba(15, 23, 42, 0.5);
      --panel-strong: rgba(255,255,255,0.12);
      --panel-soft: rgba(255,255,255,0.08);
      --card: rgba(255,255,255,0.92);
      --text: #0f172a;
      --muted: #475569;
      --line: rgba(148,163,184,0.32);
      --brand: linear-gradient(135deg, #60a5fa 0%, #8b5cf6 100%);
      --brand-2: linear-gradient(135deg, #22d3ee 0%, #2563eb 100%);
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 30px 80px rgba(15, 23, 42, 0.35);
    }

    html, body {
      min-height: 100%;
      font-family: Inter, "Segoe UI", sans-serif;
      background: #0f172a;
      color: var(--text);
    }

    body {
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(96,165,250,0.35), transparent 30%),
        radial-gradient(circle at 80% 10%, rgba(168,85,247,0.30), transparent 25%),
        linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 33%, var(--bg-3) 100%);
    }

    .background-animation {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(15,23,42,0.18), rgba(15,23,42,0.38)),
        linear-gradient(120deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.80), rgba(255,255,255,0.12) 45%, rgba(255,255,255,0.02) 70%);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.1), 0 0 40px rgba(255,255,255,0.08);
      animation: bubbleRise var(--duration) ease-in infinite;
      opacity: 0;
    }

    @keyframes bubbleRise {
      0% { transform: translateY(120vh) scale(0.7); opacity: 0; }
      10% { opacity: 0.9; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-20vh) scale(1.2) translateX(var(--offset)); opacity: 0; }
    }

    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 10px rgba(255,255,255,0.7);
      animation: twinkle var(--duration) ease-in-out infinite;
      opacity: 0;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.7); }
      30% { opacity: 1; transform: scale(1); }
      70% { opacity: 0.6; transform: scale(1.2); }
    }

    .washing-machine {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 12px 26px rgba(15,23,42,0.18);
      opacity: 0.12;
      animation: washDrift var(--duration) linear infinite;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    }

    .washing-machine::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.14);
      box-shadow: inset 0 0 14px rgba(255,255,255,0.1);
    }

    @keyframes washDrift {
      0% { transform: translateX(-120px) translateY(10vh) rotate(0deg); }
      100% { transform: translateX(calc(100vw + 180px)) translateY(-10vh) rotate(360deg); }
    }

    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      background: rgba(15, 23, 42, 0.18);
      border-bottom: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .brand {
      color: white;
      font-weight: 700;
      letter-spacing: 0.02em;
      font-size: clamp(1rem, 1.5vw, 1.35rem);
    }

    .muted {
      color: rgba(255,255,255,0.72);
      font-weight: 500;
    }

    #logout {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 110px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.24);
      background: rgba(255,255,255,0.1);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    #logout:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.16);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.18);
    }

    #logout.hidden,
    .hidden {
      display: none !important;
    }

    .content-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: calc(100vh - 72px);
      padding: 36px 20px 50px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      animation: slideUp 0.55s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login {
      width: min(100%, 430px);
      padding: 36px 32px;
      background: rgba(255,255,255,0.10);
    }

    .login h1 {
      margin-bottom: 8px;
      font-size: clamp(2rem, 4vw, 2.4rem);
      line-height: 1.1;
      color: white;
    }

    .login p {
      margin-bottom: 26px;
      color: rgba(255,255,255,0.72);
      font-size: 0.96rem;
    }

    #login-form {
      display: grid;
      gap: 14px;
    }

    #login-message {
      min-height: 1.2em;
      color: #fecaca;
      font-size: 0.82rem;
      margin-bottom: 6px;
    }

    #login-form input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      background: rgba(255,255,255,0.12);
      color: white;
      padding: 14px 16px;
      font-size: 0.98rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    #login-form input::placeholder {
      color: rgba(255,255,255,0.52);
    }

    #login-form input:focus {
      border-color: rgba(96,165,250,0.9);
      box-shadow: 0 0 0 4px rgba(96,165,250,0.18);
      transform: translateY(-1px);
    }

    #login-form button,
    .btn,
    .ad-item-actions button,
    .booking-actions .btn {
      border: none;
      border-radius: 14px;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      cursor: pointer;
    }

    #login-form button {
      margin-top: 6px;
      padding: 14px 18px;
      color: white;
      background: linear-gradient(135deg, #60a5fa 0%, #8b5cf6 100%);
      box-shadow: 0 18px 28px rgba(91, 123, 255, 0.34);
    }

    #login-form button:hover,
    .btn:hover,
    .ad-item-actions button:hover,
    .booking-actions .btn:hover {
      transform: translateY(-1px);
    }

    #app {
      width: min(100%, 1220px);
      padding: 28px 28px 32px;
      background: rgba(15,23,42,0.26);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 20px;
    }

    .toolbar h1 {
      color: white;
      font-size: clamp(2rem, 2.8vw, 2.6rem);
      margin-bottom: 6px;
    }

    #role {
      color: rgba(255,255,255,0.75);
      font-size: 0.9rem;
    }

    .filters {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filters select,
    .filters input,
    #ad-form input,
    #ad-form textarea {
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.10);
      color: white;
      padding: 11px 14px;
      font-size: 0.95rem;
      outline: none;
    }

    .filters select option,
    .filters input option {
      color: #0f172a;
    }

    .bookings-container {
      display: grid;
      gap: 16px;
    }

    .booking {
      background: rgba(255,255,255,0.90);
      border: 1px solid rgba(148,163,184,0.24);
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 16px 30px rgba(15,23,42,0.14);
    }

    .booking-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .booking-header h3 {
      font-size: 1.08rem;
      color: #0f172a;
    }

    .booking-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 92px;
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 999px;
      text-transform: capitalize;
    }

    .booking-status.pending { background: #fff7db; color: #9a6700; }
    .booking-status.confirmed { background: #dcfce7; color: #166534; }
    .booking-status.completed { background: #dbeafe; color: #1d4ed8; }

    .booking-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .booking-detail-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .booking-detail-item strong {
      color: #0f172a;
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .booking-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn {
      padding: 10px 16px;
      font-size: 0.85rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #60a5fa 0%, #8b5cf6 100%);
      color: white;
      box-shadow: 0 12px 18px rgba(91, 123, 255, 0.2);
    }

    .btn-secondary {
      background: rgba(15,23,42,0.04);
      color: #0f172a;
      border: 1px solid rgba(15,23,42,0.08);
    }

    .ad-section {
      margin-top: 32px;
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(148,163,184,0.24);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 16px 32px rgba(15,23,42,0.16);
    }

    .ad-section h2 {
      margin-bottom: 20px;
      color: #0f172a;
      font-size: clamp(1.4rem, 2.4vw, 2rem);
    }

    #ad-form {
      display: grid;
      gap: 14px;
      margin-bottom: 18px;
    }

    #ad-form input,
    #ad-form textarea {
      width: 100%;
      border: 1px solid rgba(148,163,184,0.4);
      background: rgba(248,250,252,0.9);
      color: #0f172a;
    }

    #ad-form textarea {
      resize: vertical;
      min-height: 90px;
    }

    #ad-image-preview {
      display: none;
      max-width: 220px;
      max-height: 160px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(148,163,184,0.35);
      box-shadow: 0 8px 20px rgba(15,23,42,0.1);
    }

    .form-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    #ad-message {
      min-height: 1.1em;
      margin-bottom: 16px;
      color: #0f172a;
      font-size: 0.9rem;
    }

    #ads {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .ad-item {
      background: #f8fafc;
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(15,23,42,0.05);
    }

    .ad-item img {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: linear-gradient(135deg, rgba(96,165,250,0.2), rgba(139,92,246,0.2));
    }

    .ad-item-content {
      padding: 14px;
    }

    .ad-item-content h4 {
      margin-bottom: 8px;
      font-size: 1rem;
      color: #0f172a;
    }

    .ad-item-content p {
      margin-bottom: 12px;
      color: #475569;
      line-height: 1.5;
      font-size: 0.85rem;
    }

    .ad-item-actions {
      display: flex;
      gap: 8px;
    }

    .ad-item-actions button {
      flex: 1;
      padding: 9px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .btn-edit { background: #dbeafe; color: #1d4ed8; }
    .btn-delete { background: #fee2e2; color: #b91c1c; }

    @media (max-width: 800px) {
      .toolbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .filters {
        width: 100%;
      }

      .filters select,
      .filters input {
        flex: 1 1 45%;
      }

      .content-wrap {
        padding-top: 20px;
      }
    }

    @media (max-width: 600px) {
      .bar {
        padding: 14px 18px;
      }

      .login {
        padding: 28px 22px;
      }

      #app {
        padding: 20px 16px 24px;
      }

      .booking-header,
      .booking-actions,
      .form-buttons {
        flex-direction: column;
        align-items: stretch;
      }

      .filters select,
      .filters input,
      .ad-item-actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="background-animation" id="bg-animation"></div>

  <div class="wrap">
    <div class="bar">
      <div class="brand">✦ Sparkle Laundry <span class="muted">/ Staff portal</span></div>
      <button id="logout" class="hidden">Log out</button>
    </div>

    <div class="content-wrap">
      <section id="login" class="card login">
        <h1>Welcome back</h1>
        <p class="muted">Sign in to manage Karatina bookings.</p>
        <form id="login-form">
          <div id="login-message"></div>
          <input id="email" type="email" placeholder="Staff email" required>
          <input id="password" type="password" placeholder="Password" required>
          <button type="submit">Sign in</button>
        </form>
      </section>

      <section id="app" class="hidden card" style="display:none;">
        <div class="toolbar">
          <div>
            <h1>Bookings</h1>
            <p id="role" class="muted"></p>
          </div>
          <div class="filters">
            <select id="status-filter">
              <option value="all">All statuses</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="completed">Completed</option>
            </select>
            <input type="date" id="date-filter">
          </div>
        </div>

        <div id="bookings-list" class="bookings-container"></div>

        <div class="ad-section">
          <h2 id="ad-form-title">Homepage ads</h2>
          <form id="ad-form">
            <input type="hidden" name="id">
            <input type="text" name="title" placeholder="Ad title" required>
            <textarea name="description" placeholder="Ad description" rows="3" required></textarea>
            <input type="url" id="ad-image-url" name="image_url" placeholder="Image URL" required>
            <img id="ad-image-preview">
            <div class="form-buttons">
              <button type="submit" id="ad-submit" class="btn btn-primary">Add ad</button>
              <button type="button" id="ad-cancel" class="btn btn-secondary">Cancel</button>
            </div>
          </form>
          <div id="ad-message"></div>
          <div id="ads"></div>
        </div>
      </section>
    </div>
  </div>

  <script>
    function createBackgroundAnimation() {
      const bg = document.getElementById('bg-animation');

      for (let i = 0; i < 28; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const size = Math.random() * 100 + 40;
        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';
        bubble.style.left = Math.random() * 100 + '%';
        bubble.style.top = Math.random() * 100 + '%';
        bubble.style.setProperty('--duration', (Math.random() * 6 + 9) + 's');
        bubble.style.setProperty('--offset', (Math.random() * 220 - 110) + 'px');
        bubble.style.animationDelay = (Math.random() * 5) + 's';
        bg.appendChild(bubble);
      }

      for (let i = 0; i < 80; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = Math.random() * 100 + '%';
        sparkle.style.top = Math.random() * 100 + '%';
        sparkle.style.setProperty('--duration', (Math.random() * 2 + 1.5) + 's');
        sparkle.style.animationDelay = (Math.random() * 4) + 's';
        bg.appendChild(sparkle);
      }

      for (let i = 0; i < 6; i++) {
        const machine = document.createElement('div');
        machine.className = 'washing-machine';
        machine.style.top = (Math.random() * 80 + 10) + '%';
        machine.style.left = (-10 - Math.random() * 20) + '%';
        machine.style.setProperty('--duration', (Math.random() * 18 + 18) + 's');
        machine.style.animationDelay = (Math.random() * 5) + 's';
        bg.appendChild(machine);
      }
    }
    createBackgroundAnimation();

    if (!window.SPARKLE_CONFIG || !window.SPARKLE_CONFIG.url || !window.SPARKLE_CONFIG.anonKey) {
      throw new Error('Missing Supabase config. Copy the window.SPARKLE_CONFIG block from index.html before this page loads.');
    }

    const CONFIG = window.SPARKLE_CONFIG;
    const db = supabase.createClient(CONFIG.url, CONFIG.anonKey);
    const $ = (id) => document.getElementById(id);
    const safe = (value = '') => String(value).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    async function loadAds() {
      const { data, error } = await db.from('ads').select('*').order('created_at', { ascending: false });
      if (error) {
        $('ad-message').textContent = error.message;
        return;
      }
      window.currentAds = data || [];
      $('ads').innerHTML = (data || []).map(ad => `
        <div class="ad-item">
          ${ad.image_url ? `<img src="${safe(ad.image_url)}" alt="${safe(ad.title || 'Ad image')}">` : ''}
          <div class="ad-item-content">
            <h4>${safe(ad.title || 'Untitled ad')}</h4>
            <p>${safe(ad.description || '')}</p>
            <div class="ad-item-actions">
              <button type="button" class="btn-edit" onclick="startAdEdit(${ad.id})">Edit</button>
              <button type="button" class="btn-delete" onclick="deleteAd(${ad.id})">Delete</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function updateAdImagePreview() {
      const url = $('ad-image-url').value.trim();
      const preview = $('ad-image-preview');
      preview.src = url;
      preview.style.display = url ? 'block' : 'none';
      preview.onerror = () => {
        preview.style.display = 'none';
      };
    }

    $('ad-image-url').addEventListener('input', updateAdImagePreview);

    function startAdEdit(id) {
      const ad = (window.currentAds || []).find(a => a.id === id);
      if (!ad) return;
      const form = $('ad-form');
      form.elements.id.value = ad.id;
      form.elements.title.value = ad.title || '';
      form.elements.description.value = ad.description || '';
      form.elements.image_url.value = ad.image_url || '';
      updateAdImagePreview();
      $('ad-form-title').textContent = 'Edit ad';
      $('ad-submit').textContent = 'Update ad';
      window.scrollTo({ top: $('ad-form').offsetTop - 90, behavior: 'smooth' });
    }

    function resetAdForm() {
      $('ad-form').reset();
      $('ad-form').elements.id.value = '';
      $('ad-image-preview').style.display = 'none';
      $('ad-form-title').textContent = 'Homepage ads';
      $('ad-submit').textContent = 'Add ad';
    }

    $('ad-cancel').addEventListener('click', resetAdForm);

    $('ad-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const { data: { user } } = await db.auth.getUser();
      const payload = {
        title: form.get('title'),
        description: form.get('description'),
        image_url: form.get('image_url'),
        user_id: user?.id
      };
      const id = form.get('id');
      const operation = id ? db.from('ads').update(payload).eq('id', id) : db.from('ads').insert([payload]);
      const { error } = await operation;
      $('ad-message').textContent = error ? error.message : (id ? 'Ad updated!' : 'Ad added!');
      if (!error) {
        resetAdForm();
        loadAds();
      }
    });

    async function loadBookings() {
      let query = db.from('bookings').select('*').order('created_at', { ascending: false });
      const filter = $('status-filter').value;
      if (filter !== 'all') query = query.eq('status', filter);
      const dateFilter = $('date-filter').value;
      if (dateFilter) query = query.eq('booking_date', dateFilter);
      const { data, error } = await query;
      if (error) {
        $('bookings-list').innerHTML = `<div class="booking"><strong>Error:</strong> ${safe(error.message)}</div>`;
        return;
      }

      $('bookings-list').innerHTML = (data || []).map(b => `
        <div class="booking">
          <div class="booking-header">
            <h3>${safe(b.customer_name || 'Customer')}</h3>
            <span class="booking-status ${b.status || 'pending'}">${safe(b.status || 'pending')}</span>
          </div>
          <div class="booking-details">
            <div class="booking-detail-item">
              <strong>Date</strong>
              <span>${b.booking_date ? new Date(b.booking_date).toLocaleDateString() : '—'}</span>
            </div>
            <div class="booking-detail-item">
              <strong>Phone</strong>
              <span>${safe(b.phone || '—')}</span>
            </div>
            <div class="booking-detail-item">
              <strong>Items</strong>
              <span>${safe(b.item_count || '—')}</span>
            </div>
            <div class="booking-detail-item">
              <strong>Total</strong>
              <span>KES ${Number(b.total || 0).toLocaleString()}</span>
            </div>
          </div>
          <div class="booking-actions">
            <button class="btn btn-primary" type="button">View details</button>
            <button class="btn btn-secondary" type="button">Update status</button>
          </div>
        </div>
      `).join('');
    }

    async function deleteAd(id) {
      if (!confirm('Delete this ad?')) return;
      const { error } = await db.from('ads').delete().eq('id', id);
      if (error) {
        alert(error.message);
      } else {
        loadAds();
      }
    }

    window.deleteAd = deleteAd;
    window.startAdEdit = startAdEdit;

    async function start() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) return;
      const { data: profile } = await db.from('profiles').select('full_name,role').eq('id', session.user.id).single();
      $('role').textContent = profile?.role || 'Staff';
      $('login').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('app').style.display = 'block';
      $('logout').classList.remove('hidden');
      loadBookings();
      loadAds();
    }

    $('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('login-message').textContent = '';
      const { error } = await db.auth.signInWithPassword({
        email: $('email').value,
        password: $('password').value
      });
      if (error) {
        $('login-message').textContent = error.message;
        return;
      }
      start();
    });

    $('logout').addEventListener('click', async () => {
      await db.auth.signOut();
      $('login').classList.remove('hidden');
      $('app').classList.add('hidden');
      $('app').style.display = 'none';
      $('logout').classList.add('hidden');
      $('login-form').reset();
    });

    $('status-filter').addEventListener('change', loadBookings);
    $('date-filter').addEventListener('change', loadBookings);

    start();
  </script>
</body>
</html>
