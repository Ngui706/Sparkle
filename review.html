<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f3c3a"><title>Leave a review | Sparkle Laundry</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#123232;--muted:#607473;--mint:#dff5ee;--teal:#0e847e;--dark:#0f3c3a;--yellow:#f5c84b;--cream:#fbfaf5;--line:#dce9e4}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e9f7f1,#fffaf0);color:var(--ink);font:16px 'DM Sans',sans-serif;line-height:1.55}.wrap{width:min(680px,calc(100% - 32px));margin:0 auto;padding:32px 0}.brand{font:800 1.2rem Manrope,sans-serif;text-decoration:none;color:var(--dark)}.card{margin-top:42px;padding:clamp(22px,5vw,42px);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px #0f3c3a12}.eyebrow{color:var(--teal);font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font:800 clamp(2rem,6vw,3rem)/1.1 Manrope,sans-serif;letter-spacing:-.04em;margin:8px 0 12px}p{color:var(--muted)}form{display:grid;gap:16px;margin-top:26px}label{font-size:.85rem;font-weight:700;color:#476662}input,select,textarea{display:block;width:100%;margin-top:6px;padding:13px 14px;border:1px solid var(--line);border-radius:9px;background:#fcfffd;color:var(--ink);font:inherit}textarea{min-height:150px;resize:vertical}.rating-options{display:grid;gap:8px;margin-top:8px}.rating-options label{display:flex;align-items:center;gap:9px;color:#476662;font-size:.9rem;font-weight:600}.rating-options input{width:auto;margin:0;accent-color:#f47721}.rating-stars{color:#f47721;font-size:1.15rem;letter-spacing:.08em}.button{display:inline-flex;justify-content:center;padding:13px 20px;border:0;border-radius:9px;background:var(--teal);color:white;font:700 .95rem 'DM Sans',sans-serif;text-decoration:none;cursor:pointer}.message{min-height:24px;margin:12px 0 0}.back{display:inline-block;margin-top:22px;color:var(--teal);font-weight:700;text-decoration:none}.hidden{display:none!important}
</style></head><body><main class="wrap"><a class="brand" href="index.html">✦ Sparkle Laundry</a><section class="card"><p class="eyebrow">Your experience matters</p><h1>Leave a review</h1><p>Tell us how we did. Your review will be shown on our homepage after our team approves it.</p>
<div id="login-area"><p>Log in to your Sparkle account to leave a review.</p><form id="login-form"><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button">Log in</button></form><p id="login-message" class="message" role="status"></p><p>Need an account? <a href="index.html#booking">Create one on our booking page</a>.</p></div>
<div id="review-area" class="hidden"><p id="signed-in"></p><div><b>Rating</b><div class="rating-options" role="radiogroup" aria-label="Choose a rating"><label><input type="radio" name="rating" value="5" form="review-form" required><span class="rating-stars" aria-label="5 stars">★★★★★</span><span>Excellent</span></label><label><input type="radio" name="rating" value="4" form="review-form"><span class="rating-stars" aria-label="4 stars">★★★★</span><span>Very good</span></label><label><input type="radio" name="rating" value="3" form="review-form"><span class="rating-stars" aria-label="3 stars">★★★</span><span>Good</span></label><label><input type="radio" name="rating" value="2" form="review-form"><span class="rating-stars" aria-label="2 stars">★★</span><span>Could be better</span></label><label><input type="radio" name="rating" value="1" form="review-form"><span class="rating-stars" aria-label="1 star">★</span><span>Poor</span></label></div></div><form id="review-form"><label>Your comments<textarea name="comment" maxlength="1000" required placeholder="What did you like about your Sparkle experience?"></textarea></label><button class="button">Submit review</button></form><p id="review-message" class="message" role="status"></p></div>
<a class="back" href="index.html">← Back to Sparkle Laundry</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const CONFIG={url:'https://ddvzobvioyulvchokvwo.supabase.co',anonKey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkdnpvYnZpb3l1bHZjaG9rdndvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDU4MTAsImV4cCI6MjEwNDUyMTgxMH0.gDGdXSmN8NKJ3Rx0MAuAEFizhtlUtGXn4kK0glesxNU'};
const db=supabase.createClient(CONFIG.url,CONFIG.anonKey),$=id=>document.getElementById(id);let currentUser=null;
function showUser(user){currentUser=user;$('login-area').classList.add('hidden');$('review-area').classList.remove('hidden');$('signed-in').textContent=`Signed in as ${user.user_metadata?.full_name||user.email||'customer'}.`}
async function checkSession(){const {data}=await db.auth.getSession();if(data.session)showUser(data.session.user)}
$('login-form').addEventListener('submit',async event=>{event.preventDefault();const form=new FormData(event.currentTarget);$('login-message').textContent='Signing in…';const {data,error}=await db.auth.signInWithPassword({email:form.get('email'),password:form.get('password')});if(error){$('login-message').textContent=error.message;return}showUser(data.user)});
$('review-form').addEventListener('submit',async event=>{event.preventDefault();if(!currentUser)return;$('review-message').textContent='Submitting your review…';const form=new FormData(event.currentTarget);const rating=Number(form.get('rating'));const displayName=currentUser.user_metadata?.full_name||currentUser.email?.split('@')[0]||'Customer';const {error}=await db.from('reviews').insert({user_id:currentUser.id,display_name:displayName,rating,comment:String(form.get('comment')).trim()});if(error){$('review-message').textContent=error.message;return}$('review-form').reset();$('review-message').textContent='Thank you! Your review is waiting for admin approval.'});
checkSession();
</script></body></html>
